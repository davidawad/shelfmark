[package]
name = "lcc-outline"
description = "Builds shelfmark's bundled LCC outline scheme from Library of Congress sources"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# A standalone tool, not a member of the shelfmark workspace.
[workspace]

[dependencies]
shelfmark-core = { path = "../../crates/core" }
flate2 = "1"
lopdf = "0.38"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[dev-dependencies]
jsonschema = { version = "0.56", default-features = false }
shelfmark-scheme = { path = "../../crates/scheme" }
