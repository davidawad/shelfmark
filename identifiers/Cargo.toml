[package]
name = "identifier-tables"
version = "0.1.0"
edition = "2021"
description = "Deterministic builder for identifier -> LCC/DDC lookup tables (materials classifier identifier tier)"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: no dependency on the surrounding repo (R14).
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
lto = "thin"
