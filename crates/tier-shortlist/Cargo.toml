[package]
name = "shelfmark-tier-shortlist"
description = "Embedding shortlist tier for shelfmark: coarse-to-fine cosine ranking against scheme labels"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
shelfmark-core.workspace = true
sha2.workspace = true
# Error details of a failed model load.
serde_json = { workspace = true, optional = true }
# Only the ONNX text-embedding path: ORT prebuilt binaries and model files
# fetched over rustls (no system OpenSSL). No candle, no qwen3, no images.
# fastembed 7.1 needs rustc 1.88+, above the workspace MSRV; the default
# build does not pull it. Pinned to 7.1.0: 7.1.1 is inside the 14-day
# supply-chain freeze (published 2026-10-07).
fastembed = { version = "=7.1.0", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
], optional = true }

[dev-dependencies]
shelfmark-core = { workspace = true, features = ["testkit"] }
shelfmark-scheme = { path = "../scheme" }
serde_json.workspace = true

[features]
# The real BGE-small-en-v1.5 int8 embedder (FastembedBge) and
# ShortlistTier::bge_small. The CLI turns it on as `semantic-shortlist`.
fastembed = ["dep:fastembed", "dep:serde_json"]

[[example]]
name = "shortlist-bench"
path = "examples/bench.rs"
required-features = ["fastembed"]

[lints]
workspace = true
