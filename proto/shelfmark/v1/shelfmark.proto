// shelfmark gRPC surface (R19, plan PD8).
//
// The same operations and the same shapes as the CLI: a Request names a
// verb and carries its arguments as the JSON object the CLI would send;
// the Envelope carries the JSON data the CLI would print. Payloads are
// JSON strings so the two surfaces cannot drift. The ErrorCode and Verb
// enums mirror shelfmark_core::{ErrorCode, Verb}; the core crate's
// proto_sync test fails when they disagree.
syntax = "proto3";

package shelfmark.v1;

service Shelfmark {
  // One request, one envelope.
  rpc Call(Request) returns (Envelope);
  // NDJSON over gRPC: one BatchLine per BatchItem, keyed by input hash.
  rpc Batch(stream BatchItem) returns (stream BatchLine);
}

enum Verb {
  VERB_UNSPECIFIED = 0;
  VERB_DESCRIBE = 1;
  VERB_STATUS = 2;
  VERB_RESOLVE = 3;
  VERB_CLASSIFY = 4;
  VERB_EXPLAIN = 5;
  VERB_LIST_FLAGGED = 6;
  VERB_CONFIRM = 7;
  VERB_CORRECT = 8;
  VERB_STALE = 9;
  VERB_SCHEME_COMPILE = 10;
  VERB_SCHEME_BROWSE = 11;
  VERB_SCHEME_SEARCH = 12;
  VERB_SCHEME_VALIDATE = 13;
  VERB_EVAL = 14;
  VERB_LINK = 15;
  VERB_NAME = 16;
}

enum Mode {
  MODE_PREVIEW = 0;
  MODE_COMMIT = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_INVALID_ID = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_SCHEME_INVALID = 4;
  ERROR_CODE_SCHEME_NOT_COMPILED = 5;
  ERROR_CODE_PROFILE_NOT_FOUND = 6;
  ERROR_CODE_TIER_UNAVAILABLE = 7;
  ERROR_CODE_INVALID_CODE = 8;
  ERROR_CODE_REVISION_CONFLICT = 9;
  ERROR_CODE_REVISION_REQUIRED = 10;
  ERROR_CODE_STORE_ERROR = 11;
  ERROR_CODE_INPUT_UNREADABLE = 12;
  ERROR_CODE_INTERNAL = 13;
}

message Request {
  Verb verb = 1;
  // JSON object: the verb's arguments, exactly as the CLI sends them.
  string args_json = 2;
  Mode mode = 3;
  optional string expected_revision = 4;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  // The command that would fix this, runnable as given (R21).
  optional string next_command = 3;
  // JSON value, when present.
  optional string details_json = 4;
}

message Envelope {
  bool ok = 1;
  // JSON value when ok.
  string data_json = 2;
  // Set when not ok.
  Error error = 3;
}

message BatchItem {
  // Content hash of the input (an item: ID for files).
  string input = 1;
  Request request = 2;
}

message BatchLine {
  string input = 1;
  Envelope envelope = 2;
}
