[package]
name = "mc-eval"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Evaluation harness for the materials classifier: gold sets, predictions, per-level accuracy, calibration, risk-coverage and bootstrap intervals."
publish = false

# Standalone crate with its own workspace and no dependency on the root
# workspace, so it can be built independently from its manifest.
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "mc-eval"
path = "src/bin/mc-eval.rs"
