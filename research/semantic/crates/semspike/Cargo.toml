[package]
name = "semspike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CPU semantic-tier spike: embedding shortlist + reranker over the LCC outline"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }
fastembed = { version = "7.1", default-features = false, features = ["qwen3", "ort-download-binaries-native-tls", "hf-hub-native-tls"] }
