[package]
name = "acm-ccs"
description = "Fetches the ACM Computing Classification System 2012 and builds it as a shelfmark scheme"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# A standalone tool, not a member of the shelfmark workspace.
[workspace]

[dependencies]
shelfmark-core = { path = "../../crates/core" }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[dev-dependencies]
jsonschema = { version = "0.56", default-features = false }
shelfmark-scheme = { path = "../../crates/scheme" }
