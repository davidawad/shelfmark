[package]
name = "msc-scheme"
description = "Builds shelfmark's MSC2020 scheme file from the official msc2020.org CSV"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# A standalone tool, not a member of the shelfmark workspace.
[workspace]

[dependencies]
shelfmark-core = { path = "../../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[dev-dependencies]
shelfmark-scheme = { path = "../../../crates/scheme" }
