[package]
name = "openalex-topics-scheme"
description = "Builds shelfmark's OpenAlex Topics scheme (domain > field > subfield > topic) from the OpenAlex API"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# A standalone tool, not a member of the shelfmark workspace.
[workspace]

[dependencies]
shelfmark-core = { path = "../../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[dev-dependencies]
jsonschema = { version = "0.56", default-features = false }
shelfmark-scheme = { path = "../../../crates/scheme" }
